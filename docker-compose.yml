services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amser
      POSTGRES_PASSWORD: amser
      POSTGRES_DB: amser
    ports:
      - "5433:5432"
    volumes:
      - amser_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amser"]
      interval: 3s
      retries: 20
volumes:
  amser_pg:
