# Produção em VPS (Hostinger, Hetzner, etc.) — guia: docs/deploy-vps.md
#   docker compose -f docker-compose.prod.yml up -d --build
# Lê as variáveis do arquivo .env (copie de deploy/vps/env.example).
name: amser-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: amser
    # Sem "ports": o banco só é acessível pelos containers, nunca pela internet.
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amser"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://amser:${POSTGRES_PASSWORD}@db:5432/amser?connection_limit=10
      NODE_ENV: production
      STORAGE_LOCAL_DIR: /data/uploads
      TRUST_PROXY_HOPS: "1"
    volumes:
      - uploads:/data/uploads

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://amser:${POSTGRES_PASSWORD}@db:5432/amser?connection_limit=3
      NODE_ENV: production
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    command: ["npx", "tsx", "scripts/run-jobs.ts", "--loop"]
    healthcheck:
      disable: true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg:
    name: amser_pg
  uploads:
    name: amser_uploads
  caddy_data:
    name: amser_caddy_data
  caddy_config:
    name: amser_caddy_config
